services:
  - type: web
    name: insightx-api
    runtime: node
    rootDir: Accenture/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: false
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: insightx-ml
    runtime: python
    rootDir: ML
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ml_service.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
